<!doctype html>
<!-- After 135crewdog/wings, index.html, commit 6d689b7 (first copied at 557a8d0):
     cut down to the picture, the pause button, the start, pause and crashed
     screens, the debug overlay and the rotate screen. The controls and the HUD
     are still to come. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FSG</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FSG">
  <meta name="theme-color" content="#2f7fd6">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-32.png">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="controls" hidden>
    <button id="pause" aria-label="Pause">II</button>
  </div>

  <section id="screen-start" class="screen">
    <div class="card">
      <h1>FSG</h1>
      <button id="fly" class="btn primary" disabled>Fly</button>
      <button id="settings" class="btn">Settings</button>
      <button class="btn update" hidden>New version, tap to update</button>
      <p class="about version"></p>
    </div>
  </section>

  <section id="screen-pause" class="screen" hidden>
    <div class="card" aria-label="Paused">
      <button id="resume" class="btn primary">Resume</button>
      <button id="restart" class="btn">Restart</button>
      <div class="row">
        <span id="dev-label">Debug overlay</span>
        <button id="dev-switch" class="switch" role="switch" aria-checked="false" aria-labelledby="dev-label"></button>
      </div>
      <button class="btn update" hidden>New version, tap to update</button>
      <p class="about">Flight model: JSBSim 1.3.3, LGPL 2.1</p>
      <p class="about">Cessna 172P model: FlightGear's c172p team, GPL 2</p>
    </div>
  </section>

  <section id="screen-crashed" class="screen" hidden>
    <div class="card">
      <h2 id="crash-title">Crashed</h2>
      <p id="crash-why" class="about"></p>
      <button id="crash-restart" class="btn primary">Restart</button>
      <button class="btn update" hidden>New version, tap to update</button>
    </div>
  </section>

  <pre id="dev" hidden></pre>

  <section id="rotate">
    <h1>Rotate your device</h1>
    <p>If it won't turn, turn off rotation lock.</p>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
