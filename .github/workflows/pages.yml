# Publishes main to GitHub Pages, only if the tests pass.
# After 135crewdog/wings, .github/workflows/pages.yml, commit 6d689b7 (first copied at 557a8d0).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a deployment part way

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test   # publish only if the tests pass
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
